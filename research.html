<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Research Projects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- PapaParse for CSV reading -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>


    <!-- Global Styles -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="nav-placeholder"></div>
 

    <!-- HERO -->
    <header class="hero">
        <h1>Research Projects</h1>
    </header>
        
    <section>
        <div id="project-container"></div>
    </section>

    <script>
    // CSV parser helper (handles BOM + quotation safely)
    function parseCSV(text) {
        const lines = text.trim().split("\n");
        let headers = lines[0].split(",").map(h => h.replace(/^\ufeff/, "").trim());

        return lines.slice(1).map(line => {
            const cols = line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
            const obj = {};
            headers.forEach((h, i) => obj[h] = (cols[i] || "").replace(/^"|"$/g,"").trim());
            return obj;
        });
    }

    // Build project cards
    function buildProjects(entries) {
        const container = document.getElementById("project-container");

        entries.forEach(p => {
            const card = document.createElement("div");
            card.className = "project-card";

            const img = document.createElement("img");
            img.src = p.Photo || "blank.png";
            img.alt = p.Topic;

            const textBlock = document.createElement("div");
            textBlock.innerHTML = `
                <div class="project-title">${p.Topic}</div>
                <div class="project-description">${p.Description}</div>
            `;

            card.appendChild(img);
            card.appendChild(textBlock);
            container.appendChild(card);
        });
    }

    // Load CSV
    fetch("csv/research.csv")
        .then(r => r.text())
        .then(csv => {
            const entries = parseCSV(csv);
            buildProjects(entries);
        })
        .catch(err => {
            document.getElementById("project-container").innerHTML =
                "<p>Error loading research projects.</p>";
            console.error(err);
        });

    </script>

    <script src="js/site.js"></script>

</body>
</html>
