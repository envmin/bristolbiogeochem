name: Update Publications and Deploy

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Update publication CSV
        run: python update_publications_from_orcid.py

      - name: Commit updated CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update PublicationList_vCSV.csv"
          file_pattern: PublicationList_vCSV.csv

  redeploy-pages:
    needs: update-publications
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Request GitHub Pages rebuild
        run: gh workflow run deploy-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}